name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018

jobs:
  java:
    name: Java compile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Java
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx6g :TMessagesProj_App:compileAfatReleaseJavaWithJavac -PtgeshkaAbi=arm64-v8a

  apk:
    name: APK ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep '^TGESHKA_VERSION=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TGESHKA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "TGESHKA_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No signing key (pull request from a fork?), the APK is signed with the test key"
          fi

      - name: Build APK
        env:
          TGESHKA_VERSION: ${{ steps.version.outputs.version }}
          TGESHKA_API_ID: ${{ secrets.TGESHKA_API_ID }}
          TGESHKA_API_HASH: ${{ secrets.TGESHKA_API_HASH }}
          TGESHKA_GATEWAY_URL: ${{ secrets.TGESHKA_GATEWAY_URL }}
          TGESHKA_KEYSTORE_PASSWORD: ${{ secrets.TGESHKA_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.workers.max=4 \
            :TMessagesProj_App:assembleAfatRelease -PtgeshkaAbi=${{ matrix.abi }}
          mkdir -p out
          cp TMessagesProj_App/build/outputs/apk/afat/release/app.apk "out/TGeshka-${TGESHKA_VERSION}-${{ matrix.abi }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: out/*.apk
          retention-days: 14
