name: Upstream

# Once a week: a new Telegram for Android release (a release-* tag or an
# "update to X.Y.Z (build)" commit in DrKLO/Telegram) becomes a pull request
# that merges it into main. No force pushes, the build runs on the branch.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the latest upstream release
        id: find
        run: |
          git remote add upstream https://github.com/DrKLO/Telegram.git
          git fetch --quiet --tags upstream master
          # Release commits on master: "update to 13.2.2 (7303)".
          COMMIT=$(git log upstream/master --format='%H %s' | grep -E '^[0-9a-f]+ update to [0-9]+\.[0-9]+(\.[0-9]+)? \([0-9]+\)$' | head -1 | cut -d' ' -f1)
          VERSION=$(git log -1 --format=%s "$COMMIT" | sed -E 's/update to ([0-9.]+) .*/\1/')
          # A newer release tag wins if there is one.
          TAG=$(git tag -l 'release-*' | sort -V | tail -1)
          if [ -n "$TAG" ] && ! git merge-base --is-ancestor "$TAG^{commit}" "$COMMIT"; then
            TAG_COMMIT=$(git rev-parse "$TAG^{commit}")
            if ! git merge-base --is-ancestor "$COMMIT" "$TAG_COMMIT"; then
              echo "Tag $TAG and commit $COMMIT diverged, using the commit"
            else
              COMMIT=$TAG_COMMIT
              VERSION=$(echo "$TAG" | sed -E 's/release-([0-9.]+)-.*/\1/')
            fi
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "Telegram $VERSION is already in main"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream release: Telegram $VERSION ($COMMIT)"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge into a branch and open a pull request
        if: steps.find.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.find.outputs.commit }}
          VERSION: ${{ steps.find.outputs.version }}
        run: |
          BRANCH="upstream/telegram-${VERSION}"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch $BRANCH already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH" origin/main
          CONFLICTS=""
          if ! git merge --no-ff --no-edit -m "Upstream: Telegram для Android ${VERSION}" "$COMMIT"; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            git add -A
            git commit --no-edit -m "Upstream: Telegram для Android ${VERSION}, конфликты не разрешены"
          fi
          git push origin "$BRANCH"
          BODY="Слияние релиза Telegram для Android ${VERSION} (DrKLO/Telegram ${COMMIT}) в main."
          if [ -n "$CONFLICTS" ]; then
            BODY="${BODY}

          Конфликты слияния, файлы с маркерами:
          $(echo "$CONFLICTS" | sed 's/^/- /')"
          fi
          gh pr create --base main --head "$BRANCH" --title "Upstream: Telegram для Android ${VERSION}" --body "$BODY"
          # Pull requests opened with GITHUB_TOKEN do not start workflows, start the build explicitly.
          gh workflow run build.yml --ref "$BRANCH"
